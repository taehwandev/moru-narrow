name: publish

# Publishes to PyPI when a version tag is pushed (for example v26.45.1).
# Uses PyPI trusted publishing (OIDC): no API token is stored anywhere.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must match the version in pyproject.toml
        run: |
          python - <<'EOF'
          import os, re, tomllib
          tag = os.environ["GITHUB_REF_NAME"]
          if not re.fullmatch(r"v\d{2}\.\d{1,2}\.\d+", tag):
              raise SystemExit(f"tag {tag!r} is not v<YY>.<WW>.<N>")
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          if tag != "v" + version:
              raise SystemExit(f"tag {tag} != pyproject version {version}")
          EOF
      - run: python -m pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
