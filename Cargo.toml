[package]
name = "moru-narrow"
version = "26.48.0"
edition = "2021"
license = "MIT"
description = "Rank ripgrep symbol hits into Tier 1 call sites for Kotlin, TypeScript, Python, and Rust"
repository = "https://github.com/taehwandev/moru-narrow"

[[bin]]
name = "moru-narrow"
path = "src/main.rs"

[[bin]]
name = "mnarrow"
path = "src/bin/mnarrow.rs"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
