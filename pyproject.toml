[project]
name = "moru-narrow"
version = "0.0.1"
description = "Narrow `rg -w <Name>` to the files and lines you must edit after a signature change (Kotlin+Gradle, TypeScript)."
requires-python = ">=3.9"
readme = "README.md"
# license intentionally unset until decided

[project.scripts]
moru-narrow = "moru_narrow.__main__:main"
mnarrow = "moru_narrow.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["moru_narrow"]
